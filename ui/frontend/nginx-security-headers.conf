# Security headers for every response nginx serves.
#
# nginx drops all server-level add_header lines for a location that sets any
# add_header of its own, so this file is included both at server level and in
# each such location in nginx.conf. Keep every security header here, not in
# nginx.conf, or the SPA pages and static files lose them.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# "0" disables the legacy browser XSS filter, which itself caused XSS in older
# browsers.
add_header X-XSS-Protection "0" always;
# Browser features the app does not use.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Browsers apply this only on HTTPS responses (Caddy terminates TLS in front of
# nginx), so it is ignored on a plain-HTTP local stack.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Where the pages may load scripts, styles, images, fonts, workers and
# connections from, plus no framing by other sites, no plugins and no <base>
# pointing elsewhere. render-nginx-conf.sh fills this in when the container
# starts, from UI_CSP_POLICY or its default (scripts and workers from this site
# only, plus Google Analytics). This file is a template: keep the placeholder.
add_header Content-Security-Policy "__UI_CSP_POLICY__" always;
