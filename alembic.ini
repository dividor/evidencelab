[alembic]
script_location = alembic
# Put the repository root (the folder holding this file) on sys.path, so a
# migration can import application code (0036 imports ui.backend) when
# alembic runs on a host without PYTHONPATH, as Demo E2E and host scripts do.
# The containers already set PYTHONPATH=/app, which is the same folder.
prepend_sys_path = %(here)s
path_separator = os
sqlalchemy.url = postgresql://localhost:5432/evidencelab

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
