name: Docs check

# Checks that a pull request which changes something users or administrators
# see also updates the online docs in docs/. The rules are in
# .github/review/docs-check.md, the same checklist contributors follow before
# opening a pull request. The model's answer is a fixed JSON verdict; this
# workflow posts it as one comment on the pull request and fails the check when
# docs are missing.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  docs-check:
    # Fork pull requests and Dependabot get no repository secrets, so the check
    # can't run there; drafts are checked once they are ready for review.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # pull-requests: the verdict comment. id-token: signing in to the model
    # with the job's OIDC token (workload identity federation).
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      # The pull request merged into its base: HEAD^1 is the base, so
      # `git diff HEAD^1 HEAD` is exactly this pull request's change.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Check the docs
        id: check
        uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1.0.290
        with:
          # Workload identity federation: the job's GitHub OIDC token is
          # exchanged for a short-lived token, so no API key is stored.
          anthropic_federation_rule_id: ${{ vars.AI_REVIEW_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.AI_REVIEW_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.AI_REVIEW_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.AI_REVIEW_WORKSPACE_ID }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Run the docs check in .github/review/docs-check.md on this pull request,
            following it exactly. The change is `git diff HEAD^1 HEAD`: the checkout is
            the pull request merged into its base, so the files on disk are the state
            after the change. Read only; change nothing. Answer with the structured output.
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
            --disallowedTools "Edit,Write,NotebookEdit,WebFetch,WebSearch"
            --json-schema '{"type":"object","additionalProperties":false,"required":["needs_docs","covered","reason","missing","notes"],"properties":{"needs_docs":{"type":"boolean"},"covered":{"type":"boolean"},"reason":{"type":"string"},"missing":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["what","where"],"properties":{"what":{"type":"string"},"where":{"type":"string"}}}},"notes":{"type":"array","items":{"type":"string"}}}}'

      # TEMPORARY, to be removed before merging: when the check fails, show why
      # the model call failed without the action's full output. Prints the
      # GitHub token's claims (not secret), the token exchange's status and
      # error, and the status of a one-word model call. Tokens are masked.
      - name: Diagnose the model sign-in (temporary)
        if: always() && steps.check.outcome == 'failure'
        env:
          RULE: ${{ vars.AI_REVIEW_FEDERATION_RULE_ID }}
          ORG: ${{ vars.AI_REVIEW_ORGANIZATION_ID }}
          ACCOUNT: ${{ vars.AI_REVIEW_SERVICE_ACCOUNT_ID }}
          WORKSPACE: ${{ vars.AI_REVIEW_WORKSPACE_ID }}
        run: |
          python3 - <<'EOF'
          import base64, json, os, urllib.error, urllib.request

          def call(url, body=None, headers=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(url, data=data, headers=headers or {})
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      return resp.status, json.loads(resp.read() or b"{}")
              except urllib.error.HTTPError as err:
                  return err.code, json.loads(err.read() or b"{}")

          oidc_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=https://api.anthropic.com"
          _, oidc = call(oidc_url, headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          jwt = oidc["value"]
          print(f"::add-mask::{jwt}")
          payload = jwt.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          print("GitHub token claims:", json.dumps({k: claims.get(k) for k in ("sub", "aud", "iss", "event_name", "ref", "environment", "repository")}))

          status, body = call("https://api.anthropic.com/v1/oauth/token", {
              "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
              "assertion": jwt,
              "federation_rule_id": os.environ["RULE"],
              "organization_id": os.environ["ORG"],
              "service_account_id": os.environ["ACCOUNT"],
              "workspace_id": os.environ["WORKSPACE"],
          }, {"content-type": "application/json"})
          token = body.get("access_token")
          if token:
              print(f"::add-mask::{token}")
          print("Token exchange:", status, json.dumps({k: ("<redacted>" if k.endswith("token") else v) for k, v in body.items()}))
          if not token:
              raise SystemExit(0)

          status, body = call("https://api.anthropic.com/v1/messages", {
              "model": "claude-opus-5-5", "max_tokens": 16,
              "messages": [{"role": "user", "content": "Reply with the word OK."}],
          }, {"content-type": "application/json", "authorization": "Bearer " + token,
              "anthropic-version": "2023-06-01"})
          print("Model call:", status, json.dumps(body.get("error") or {"stop_reason": body.get("stop_reason")}))
          EOF

      - name: Post the verdict and fail when docs are missing
        if: always() && steps.check.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERDICT: ${{ steps.check.outputs.structured_output }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/ci/review_comment.py docs
