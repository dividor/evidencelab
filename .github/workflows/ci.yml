name: CI

on:
  push:
    branches: [ main, 'release-*', copilot/** ]
  pull_request:
    branches: [ main, 'release-*' ]

permissions: {}

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: ui/frontend/package-lock.json

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ui/frontend

      - name: Run pre-commit hooks
        run: |
          pre-commit run --all-files

  security-scan:
    runs-on: ubuntu-latest
    needs: code-quality
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: ui/frontend/package-lock.json

      # The scanners, at the versions in security-requirements.txt
      - name: Install scanners
        run: pip install -r security-requirements.txt

      # Python dependency vulnerability scanning
      - name: Run pip-audit
        run: |
          pip-audit -r requirements.txt -r ui/backend/requirements.txt -r requirements.metrics.txt -r security-requirements.txt --desc on || true
        continue-on-error: true

      # Python SAST with Bandit. Any high-severity finding fails the build,
      # with every check on. (pre-commit also fails on medium findings, with
      # the checks it skips listed in .pre-commit-config.yaml.)
      - name: Run Bandit (fails on high severity)
        run: bandit -r pipeline/ ui/backend/ -lll

      # The full list down to medium severity, kept as a report.
      - name: Bandit report, medium and above
        run: bandit -r pipeline/ ui/backend/ -ll --exit-zero -f json -o bandit-report.json
        if: always()

      - name: Upload Bandit Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bandit-report
          path: bandit-report.json
        if: always()

      # JavaScript dependency vulnerability scanning
      - name: Install frontend dependencies
        working-directory: ui/frontend
        run: npm ci

      - name: Run npm audit
        working-directory: ui/frontend
        run: |
          npm audit --audit-level=high || true
        continue-on-error: true

      # Dockerfile linting
      - name: Run Hadolint on main Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008,DL3013,DL3042
        continue-on-error: true

      - name: Run Hadolint on backend Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ui/backend/Dockerfile
          ignore: DL3008,DL3013,DL3042
        continue-on-error: true

      - name: Run Hadolint on frontend Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ui/frontend/Dockerfile
          ignore: DL3008,DL3013,DL3042
        continue-on-error: true

      # Secret scanning with Gitleaks
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: gitleaks.toml

  sbom:
    runs-on: ubuntu-latest
    needs: security-scan
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: ui/frontend/package-lock.json

      # Python SBOM (CycloneDX format)
      - name: Install cyclonedx-bom
        run: pip install -r security-requirements.txt

      - name: Generate Python SBOM
        run: |
          pip install -r requirements.txt
          cyclonedx-py environment -o sbom-python.json --output-format json

      # JavaScript SBOM
      - name: Install frontend dependencies
        working-directory: ui/frontend
        run: npm ci

      - name: Generate JavaScript SBOM
        working-directory: ui/frontend
        run: npx --yes @cyclonedx/cyclonedx-npm@7.0.1 --output-format JSON --output-file ../../sbom-javascript.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-reports
          path: |
            sbom-python.json
            sbom-javascript.json
        if: always()

  container-scan:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift \
            /usr/local/graalvm /usr/local/share/boost /usr/share/miniconda
          docker system prune -af
          df -h /

      - name: Log in to Docker Hub
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker

      # Scan the images production runs and publish-images.yml publishes:
      # the Python runtime target and the nginx UI build.
      - name: Build API image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: runtime
          tags: evidencelab-api:scan

      - name: Build frontend image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ui/frontend/Dockerfile.prod
          build-contexts: |
            customize=./customize
            config=.
          tags: evidencelab-ui:scan

      # trivy-action is pinned by commit, and Trivy itself by version: in
      # March 2026 the action's version tags were moved to code that stole CI
      # secrets (GHSA-69fq-xp46-6x23). Use an immutable release's commit.
      - name: Run Trivy on API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.76.2'
          image-ref: 'evidencelab-api:scan'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
        continue-on-error: true

      # Any high or critical finding in the web image fails the build.
      - name: Run Trivy on UI image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.76.2'
          image-ref: 'evidencelab-ui:scan'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  tests:
    runs-on: ubuntu-latest
    needs: code-quality
    env:
      HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
      # The TOC classification tests call the uneg tag model (Azure Foundry)
      AZURE_FOUNDRY_KEY: ${{ secrets.AZURE_FOUNDRY_KEY }}
      AZURE_FOUNDRY_ENDPOINT: ${{ vars.AZURE_FOUNDRY_ENDPOINT }}
      API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
      AUTH_SECRET_KEY: ${{ secrets.AUTH_SECRET_KEY }}
      KEY_ENCRYPTION_KEY: ${{ secrets.KEY_ENCRYPTION_KEY }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v \
            --cov=pipeline --cov=mcp_server --cov=a2a_server --cov=ui/backend --cov=utils \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage.xml

  integration-tests:
    # Fork PRs receive no repository or environment secrets, so the compose
    # stack cannot start; maintainers run this suite on a same-repo branch.
    if: github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    needs: [tests, ui-tests]
    environment: ENV1
    outputs:
      ux_verdict: ${{ steps.ux.outputs.structured_output }}
    # The UX review at the end of this job comments on the pull request and
    # reports its own "UX review" check, and signs in to the model with the
    # job's OIDC token (id-token); the rest of the job only reads.
    permissions:
      contents: read
      pull-requests: write
      checks: write
      id-token: write
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      UI_BASE_URL: ${{ vars.UI_BASE_URL }}
      API_SECRET_KEY: ${{ secrets.API_SECRET_KEY || 'ci-integration-test-key' }}
      # The web interface's key is public, so it differs from API_SECRET_KEY:
      # the MCP and A2A tests use API_SECRET_KEY, which MCP refuses when it is
      # also the key built into the page.
      REACT_APP_API_KEY: ${{ format('{0}-web', secrets.API_SECRET_KEY || 'ci-integration-test-key') }}
      DENSE_EMBEDDING_MODEL: ${{ vars.DENSE_EMBEDDING_MODEL }}
      QDRANT_HOST: ${{ vars.QDRANT_HOST }}
      CELERY_BROKER_URL: ${{ vars.CELERY_BROKER_URL }}
      CELERY_RESULT_BACKEND: ${{ vars.CELERY_RESULT_BACKEND }}
      RATE_LIMIT_SEARCH: ${{ vars.RATE_LIMIT_SEARCH }}
      RATE_LIMIT_DEFAULT: ${{ vars.RATE_LIMIT_DEFAULT }}
      RATE_LIMIT_AI: ${{ vars.RATE_LIMIT_AI }}
      AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
      AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
      AZURE_FOUNDRY_KEY: ${{ secrets.AZURE_FOUNDRY_KEY }}
      AZURE_FOUNDRY_ENDPOINT: ${{ vars.AZURE_FOUNDRY_ENDPOINT }}
      DATA_MOUNT_PATH: ${{ vars.DATA_MOUNT_PATH }}
      SHORT_QUERY_DENSE_WEIGHT: ${{ vars.SHORT_QUERY_DENSE_WEIGHT }}
      HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
      AUTH_SECRET_KEY: ${{ secrets.AUTH_SECRET_KEY }}
      KEY_ENCRYPTION_KEY: ${{ secrets.KEY_ENCRYPTION_KEY }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    steps:
      # Two commits deep, so the UX review can see this pull request's change
      # (`git diff HEAD^1 HEAD` on the pull request merged into its base).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Free disk space
        run: |
          echo "Disk space before cleanup:"
          df -h /
          # Remove large unused packages and directories
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift \
            /usr/local/graalvm /usr/local/share/boost /usr/share/miniconda \
            /usr/local/share/powershell /usr/share/az_* /opt/az \
            /usr/local/julia* /opt/hostedtoolcache
          # Clean docker and container images
          docker system prune -af --volumes
          # Clean apt cache
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          echo "Disk space after cleanup:"
          df -h /

      - name: Write .env for docker compose
        run: |
          cat <<EOF > .env
          API_BASE_URL=${API_BASE_URL}
          UI_BASE_URL=${UI_BASE_URL}
          API_SECRET_KEY=${API_SECRET_KEY}
          REACT_APP_API_KEY=${REACT_APP_API_KEY}
          DENSE_EMBEDDING_MODEL=${DENSE_EMBEDDING_MODEL}
          QDRANT_HOST=${QDRANT_HOST}
          CELERY_BROKER_URL=${CELERY_BROKER_URL}
          CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
          RATE_LIMIT_SEARCH=${RATE_LIMIT_SEARCH}
          RATE_LIMIT_DEFAULT=${RATE_LIMIT_DEFAULT}
          RATE_LIMIT_AI=${RATE_LIMIT_AI}
          AZURE_OPENAI_KEY=${AZURE_OPENAI_KEY}
          AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
          AZURE_FOUNDRY_KEY=${AZURE_FOUNDRY_KEY}
          AZURE_FOUNDRY_ENDPOINT=${AZURE_FOUNDRY_ENDPOINT}
          DATA_MOUNT_PATH=${DATA_MOUNT_PATH:-./data}
          SHORT_QUERY_DENSE_WEIGHT=${SHORT_QUERY_DENSE_WEIGHT:-0.25}
          HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY}
          AUTH_SECRET_KEY=${AUTH_SECRET_KEY}
          KEY_ENCRYPTION_KEY=${KEY_ENCRYPTION_KEY}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          EOF
        working-directory: ${{ github.workspace }}

      - name: Ensure .env exists
        run: |
          test -f .env || touch .env
        working-directory: ${{ github.workspace }}

      - name: Log in to Docker Hub
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build shared Python image
        run: |
          # The test target adds the browsers the UI integration tests drive.
          docker build -t evidencelab-ai-python:latest --target test .
        working-directory: ${{ github.workspace }}

      - name: Start Docker services
        run: |
          docker compose up -d
        working-directory: ${{ github.workspace }}

      - name: Wait for Postgres and run migrations
        run: |
          docker compose exec -T pipeline /bin/bash -lc "
            for i in \$(seq 1 30); do
              python -c 'from pipeline.db.config import get_engine; get_engine().connect().close()' 2>/dev/null && break
              echo 'Waiting for Postgres...' && sleep 2
            done
            alembic upgrade head
          "

      - name: Wait for API to be healthy
        run: |
          echo "Waiting for API at http://localhost:8000/health..."
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "API is healthy."
              break
            fi
            echo "Waiting for API... ($i/60)"
            sleep 2
          done

      - name: Wait for embedding server
        run: |
          echo "Waiting for embedding server at http://localhost:7997..."
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:7997/health >/dev/null 2>&1 || \
               curl -fsS http://localhost:7997/ >/dev/null 2>&1; then
              echo "Embedding server is ready."
              break
            fi
            echo "Waiting for embedding server... ($i/60)"
            sleep 2
          done

      - name: Run integration tests
        run: |
          docker compose exec -T pipeline /bin/bash -lc "API_BASE_URL=http://api:8000 UI_BASE_URL=http://ui:3000 pytest tests/integration -v -s --ignore=tests/integration/test_translation_integration.py"

      # The translation tests call Google's free translate endpoint, which
      # intermittently answers CI runners with an error page for hours at a
      # time. They still run on every PR and report their result here, but a
      # third-party outage must not block a merge, so this step cannot fail
      # the job. A failure shows as a warning annotation on the run.
      - name: Run translation integration tests (external service, non-blocking)
        continue-on-error: true
        run: |
          docker compose exec -T pipeline /bin/bash -lc "API_BASE_URL=http://api:8000 UI_BASE_URL=http://ui:3000 pytest tests/integration/test_translation_integration.py -v -s"

      # UX review of pull requests that change the web app, on the stack the
      # tests above ran against. A model follows .github/review/ux-review.md,
      # opening the changed screens at phone and desktop size in a headless
      # Chrome through Playwright MCP. scripts/ci/review_comment.py posts its
      # findings on the pull request and reports them as a separate "UX review"
      # check; none of these steps can fail this job.
      - name: Find web app changes
        id: ui-changes
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet HEAD^1 HEAD -- ui/frontend/src; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js for the UX review
        if: steps.ui-changes.outputs.changed == 'true'
        continue-on-error: true
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install the UX review's browser tool
        id: ux-tool
        if: steps.ui-changes.outputs.changed == 'true'
        continue-on-error: true
        run: |
          google-chrome --version
          npm ci --prefix .github/review/ux --ignore-scripts --no-audit --no-fund

      # A realistic saved brief (scripts/ci/saved_brief.py), built through the API
      # as the Brief tab builds one, for the review to open.
      - name: Build a saved brief for the UX review
        if: steps.ui-changes.outputs.changed == 'true' && steps.ux-tool.outcome == 'success'
        continue-on-error: true
        run: |
          docker compose exec -T pipeline /bin/bash -lc "python -m scripts.ci.saved_brief --api-url http://api:8000 --out ux-review/saved-brief.json"
        working-directory: ${{ github.workspace }}

      - name: UX review
        id: ux
        if: steps.ui-changes.outputs.changed == 'true' && steps.ux-tool.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 30
        uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1.0.290
        with:
          # Workload identity federation: the job's GitHub OIDC token is
          # exchanged for a short-lived token, so no API key is stored.
          anthropic_federation_rule_id: ${{ vars.AI_REVIEW_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.AI_REVIEW_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.AI_REVIEW_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.AI_REVIEW_WORKSPACE_ID }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Run the UX review in .github/review/ux-review.md on this pull request,
            following it exactly. The change is `git diff HEAD^1 HEAD`: the checkout is
            the pull request merged into its base. The web app is running at
            http://localhost:3000 with the integration tests' data; use the playwright
            tools to open it, resize the window, and take screenshots. Give every
            screenshot a file name of the form <screen>-<state>-<width>.png.
            If the change touches the Brief, review a saved brief as well. The file
            ux-review/saved-brief.json holds one. On http://localhost:3000, run
            localStorage.setItem('evidencelab_brief_history_v1', JSON.stringify([<the
            file's JSON>])) with the evaluate tool, reload, open the Brief tab, choose
            "Load a saved brief" and then "School meals: what the evaluations show".
            Read only; change nothing. Answer with the structured output.
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 120
            --mcp-config .github/review/ux/mcp.json
            --allowedTools "Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git show:*),mcp__playwright"
            --disallowedTools "Edit,Write,NotebookEdit,WebFetch,WebSearch"
            --json-schema '{"type":"object","additionalProperties":false,"required":["verdict","summary","screens","findings"],"properties":{"verdict":{"type":"string","enum":["looks good","needs changes","could not review"]},"summary":{"type":"string"},"screens":{"type":"array","items":{"type":"string"}},"findings":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["severity","where","what","fix"],"properties":{"severity":{"type":"string","enum":["must fix","should fix","nit"]},"where":{"type":"string"},"what":{"type":"string"},"fix":{"type":"string"}}}}}}'

      - name: Keep the UX review's screenshots
        if: always() && steps.ui-changes.outputs.changed == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ux-review-screenshots
          path: ux-review-screenshots/
          if-no-files-found: warn

      - name: Post the UX review
        if: always() && steps.ui-changes.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERDICT: ${{ steps.ux.outputs.structured_output }}
          REVIEW_OUTCOME: ${{ steps.ux.outcome }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/ci/review_comment.py ux

      # When a step above fails, print what the services said, so the cause is
      # in the job's log: each container's state, and the last lines of the
      # services the tests depend on (the embedding server's start included).
      - name: Show the services' state and logs (on failure)
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --timestamps --tail=200 embedding-server api pipeline mcp
        working-directory: ${{ github.workspace }}

  ux-fix:
    # After a UX review with findings, the model fixes them on the pull
    # request's branch and scripts/ci/fix_pr.py opens the fix as a pull request
    # into that branch, for its author to review and merge. Its own job, so the
    # job that runs the pull request's code never holds write access.
    needs: integration-tests
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.integration-tests.outputs.ux_verdict != '' &&
      toJSON(fromJSON(needs.integration-tests.outputs.ux_verdict).findings) != '[]' &&
      !startsWith(github.head_ref, 'docs-fix/') &&
      !startsWith(github.head_ref, 'ux-fix/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # contents and pull-requests: the fix branch and its pull request.
    # id-token: signing in to the model.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Fix the UX review's findings
        uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1.0.290
        with:
          anthropic_federation_rule_id: ${{ vars.AI_REVIEW_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.AI_REVIEW_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.AI_REVIEW_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.AI_REVIEW_WORKSPACE_ID }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            The UX review (.github/review/ux-review.md) of this pull request found
            these problems in the web app:

            ${{ needs.integration-tests.outputs.ux_verdict }}

            Fix each finding, with the smallest change that does it, in the component
            or CSS file it names where it names one. The pull request's change is
            `git diff origin/${{ github.base_ref }}...HEAD`. Follow the UI rules in
            CLAUDE.md and .github/review/ux-review.md: use the app's existing colour
            variables and components, keep text at 12 px or more and controls at 24 px
            or more, and change nothing the findings don't ask for. Change only files
            under ui/frontend/src/, and don't commit.
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
            --disallowedTools "NotebookEdit,WebFetch,WebSearch"

      - name: Open the fix pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERDICT: ${{ needs.integration-tests.outputs.ux_verdict }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/ci/fix_pr.py ux

  terraform:
    # Checks the cloud deployment templates: formatting, validity, and the
    # plan-only tests in deploy/<cloud>/tests (mocked providers, no cloud
    # account).
    runs-on: ubuntu-latest
    needs: code-quality
    strategy:
      fail-fast: false
      matrix:
        template: [aws, azure, gcp]
    defaults:
      run:
        working-directory: deploy/${{ matrix.template }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialise
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

      - name: Test
        run: terraform test

  ui-tests:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: ui/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ui/frontend

      - name: Copy UI config.json
        run: cp "${{ github.workspace }}/config.json" "${{ github.workspace }}/ui/frontend/src/config.json"

      - name: Run UI unit tests
        run: npm test -- --watchAll=false
        working-directory: ui/frontend
