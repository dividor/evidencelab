# Build the Evidence Lab Python image (Dockerfile, target runtime: API, MCP
# server and pipeline) for amd64 and arm64 and publish it to Docker Hub and the
# GitHub Container Registry (GHCR).
#
# The web interface is not published. Its build fixes the API key or sign-in
# mode, config.json and branding into the JavaScript bundle, so a shared image
# would either not reach the API or expose a key. docker-compose.hub.yml builds
# it locally instead (about 3 minutes).
#
# The image is built once per commit and never rebuilt for a release:
#   merge to main          -> builds it: sha-<7 characters of the commit>, and
#                             main (moves to the newest commit on main)
#   push to release-X.Y    -> the same for a patch branch: sha-<...>, release-X.Y
#   tag vX.Y.Z-rc.N        -> adds X.Y.Z-rc.N to that commit's image
#   tag vX.Y.Z             -> adds X.Y.Z, plus X.Y and latest when it is the
#                             newest release of its line and overall, and
#                             publishes the GitHub release (title from the
#                             annotated tag's message, notes from CHANGELOG.md)
# Both kinds of tag need CHANGELOG.md's X.Y.Z entry at the tagged commit,
# because the release is tagged on the tested candidate's own commit, and the
# commit's newest CI and Demo E2E runs must have passed: building the image
# doesn't wait for them, so the tag does.
# Adding a name copies the image's index as it is, so every name of a commit's
# image has the same digest. A tag on a commit with no published image (not
# merged to main, or its build failed) fails with nothing published.
# scripts/release/release_tags.py decides the names; its unit tests are
# tests/unit/test_release_tags.py.
#
# Every pull request to main or a release-X.Y branch builds both platforms
# without pushing. The two build jobs are required checks, so a change that
# breaks the image (a Dockerfile, a requirement, a base-image bump) cannot be
# merged, by a person or by the Dependabot auto-merge. They run on every PR
# because a required check that is skipped by a path filter never reports,
# which would block the PR.
#
# Runs share a concurrency group per commit, so a tag pushed while its commit's
# image is still building waits for that build.
#
# Setup (once, by a maintainer):
#   - Repository variable DOCKERHUB_NAMESPACE: the Docker Hub account to push to.
#   - Environment "dockerhub", deployment branches limited to main, release-*
#     and tags v*, holding secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a
#     Docker Hub personal access token with Read & Write scope).
#   GHCR uses the workflow's own GITHUB_TOKEN.

name: Publish images

on:
  push:
    branches: [ main, 'release-*' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, 'release-*' ]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-images-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PUBLISH: ${{ github.event_name != 'pull_request' }}
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
  IMAGE: evidencelab

jobs:
  build:
    name: build (${{ matrix.arch.name }})
    # A release tag adds names to an image that is already built.
    if: github.ref_type != 'tag'
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 120
    # Publishing runs read the push credentials from the protected environment.
    # Pull request runs only build, so they take no environment.
    environment: ${{ github.event_name != 'pull_request' && 'dockerhub' || '' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - name: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      # The image needs more than the runner's free disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift \
            /usr/local/graalvm /usr/local/share/boost /usr/share/miniconda
          docker system prune -af
          df -h /

      # Default checkout settings, as in ci.yml. persist-credentials: false
      # makes checkout walk submodules at once, and the repository's
      # pipeline/integration/evidencelab-ai-integration gitlink has no
      # .gitmodules entry, so git exits 128. .dockerignore keeps .git out of
      # the build context, so the persisted token never reaches the image.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve image names
        id: names
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$PUBLISH" = "true" ] && [ -z "$DOCKERHUB_NAMESPACE" ]; then
            echo "::error::Repository variable DOCKERHUB_NAMESPACE is not set"
            exit 1
          fi
          if [ -n "$DOCKERHUB_NAMESPACE" ]; then
            echo "dockerhub=docker.io/${DOCKERHUB_NAMESPACE}/${IMAGE}" >> "$GITHUB_OUTPUT"
          fi
          echo "ghcr=ghcr.io/${OWNER,,}/${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ steps.names.outputs.dockerhub }}
            ${{ steps.names.outputs.ghcr }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publishing pushes this platform's image by digest to both registries;
      # the merge job then tags one multi-arch manifest. Pull requests build
      # into the cache only.
      - name: Build options
        id: opts
        env:
          DOCKERHUB_IMAGE: ${{ steps.names.outputs.dockerhub }}
          GHCR_IMAGE: ${{ steps.names.outputs.ghcr }}
          ARCH: ${{ matrix.arch.name }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            echo "outputs=type=image,\"name=${DOCKERHUB_IMAGE},${GHCR_IMAGE}\",push-by-digest=true,name-canonical=true,push=true" >> "$GITHUB_OUTPUT"
            echo "cache-to=type=registry,ref=${DOCKERHUB_IMAGE}:buildcache-${ARCH},mode=max" >> "$GITHUB_OUTPUT"
          else
            echo "outputs=type=cacheonly" >> "$GITHUB_OUTPUT"
            echo "cache-to=" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$DOCKERHUB_IMAGE" ]; then
            echo "cache-from=type=registry,ref=${DOCKERHUB_IMAGE}:buildcache-${ARCH}" >> "$GITHUB_OUTPUT"
          else
            echo "cache-from=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: ${{ matrix.arch.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: ${{ steps.opts.outputs.outputs }}
          cache-from: ${{ steps.opts.outputs.cache-from }}
          cache-to: ${{ steps.opts.outputs.cache-to }}
          provenance: ${{ env.PUBLISH == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ env.PUBLISH == 'true' }}

      - name: Record digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch.name }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: publish
    if: github.event_name != 'pull_request' && github.ref_type != 'tag'
    needs: build
    runs-on: ubuntu-24.04
    environment: dockerhub
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Resolve image names
        id: names
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "$DOCKERHUB_NAMESPACE" ]; then
            echo "::error::Repository variable DOCKERHUB_NAMESPACE is not set"
            exit 1
          fi
          echo "dockerhub=docker.io/${DOCKERHUB_NAMESPACE}/${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "ghcr=ghcr.io/${OWNER,,}/${IMAGE}" >> "$GITHUB_OUTPUT"

      # The branch name moves only if this commit is still the branch's newest,
      # so an older commit's slower build never moves it backwards.
      - name: Tags
        id: tags
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          head="$(git ls-remote origin "refs/heads/${BRANCH}" | cut -f1)"
          names="$(python3 scripts/release/release_tags.py branch-tags \
            --branch "$BRANCH" --sha "$GITHUB_SHA" --head "$head" | tr '\n' ' ')"
          echo "Commit ${GITHUB_SHA} (${BRANCH} head ${head}): ${names}"
          {
            echo "source=$(python3 scripts/release/release_tags.py source-tag --sha "$GITHUB_SHA")"
            echo "names=${names}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        working-directory: ${{ runner.temp }}/digests
        env:
          DOCKERHUB_IMAGE: ${{ steps.names.outputs.dockerhub }}
          GHCR_IMAGE: ${{ steps.names.outputs.ghcr }}
          NAMES: ${{ steps.tags.outputs.names }}
        run: |
          set -euo pipefail
          read -ra names <<< "$NAMES"
          for repo in "$DOCKERHUB_IMAGE" "$GHCR_IMAGE"; do
            tag_args=()
            for name in "${names[@]}"; do tag_args+=(-t "${repo}:${name}"); done
            sources=()
            for digest in *; do sources+=("${repo}@sha256:${digest}"); done
            docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          done

      - name: Inspect
        env:
          DOCKERHUB_IMAGE: ${{ steps.names.outputs.dockerhub }}
          GHCR_IMAGE: ${{ steps.names.outputs.ghcr }}
          SOURCE: ${{ steps.tags.outputs.source }}
        run: |
          docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:${SOURCE}"
          docker buildx imagetools inspect "${GHCR_IMAGE}:${SOURCE}"

  release:
    name: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    environment: dockerhub
    permissions:
      contents: write
      packages: write
      # To read the tagged commit's CI and Demo E2E runs.
      actions: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Everything is worked out and checked before anything is published: the
      # names, and for a release its notes and title.
      - name: Read the tag
        id: tag
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ -z "$DOCKERHUB_NAMESPACE" ]; then
            echo "::error::Repository variable DOCKERHUB_NAMESPACE is not set"
            exit 1
          fi
          echo "dockerhub=docker.io/${DOCKERHUB_NAMESPACE}/${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "ghcr=ghcr.io/${OWNER,,}/${IMAGE}" >> "$GITHUB_OUTPUT"
          git fetch --no-tags --depth=1 origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          commit="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          source="$(python3 scripts/release/release_tags.py source-tag --sha "$commit")"
          git ls-remote --tags --refs origin 'v*' > "${RUNNER_TEMP}/release-tags.txt"
          names="$(python3 scripts/release/release_tags.py version-tags \
            --tag "$TAG" --existing "${RUNNER_TEMP}/release-tags.txt" | tr '\n' ' ')"
          is_release="$(python3 scripts/release/release_tags.py is-release --tag "$TAG")"
          latest=false
          case " ${names} " in *" latest "*) latest=true ;; esac
          # A candidate needs the release's changelog entry too: the release is
          # tagged on the candidate's own commit.
          python3 scripts/release/release_tags.py release-notes \
            --tag "$TAG" --changelog CHANGELOG.md > "${RUNNER_TEMP}/release-notes.md"
          if [ "$is_release" = "true" ]; then
            title="$(python3 scripts/release/release_tags.py release-title --tag "$TAG" \
              --tag-type "$(git for-each-ref --format='%(objecttype)' "refs/tags/${TAG}")" \
              --subject "$(git for-each-ref --format='%(contents:subject)' "refs/tags/${TAG}")")"
            echo "title=${title}" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "commit=${commit}"
            echo "source=${source}"
            echo "names=${names}"
            echo "is_release=${is_release}"
            echo "latest=${latest}"
          } >> "$GITHUB_OUTPUT"
          echo "Commit ${commit}: image ${source} gets ${names}"

      # Building the image doesn't wait for CI or Demo E2E, so a version tag
      # does: it names only a commit whose newest CI run (unit, UI and
      # integration tests, the security and image scans, the Terraform tests)
      # and Demo E2E run both passed.
      - name: Check the commit passed CI and Demo E2E
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ steps.tag.outputs.commit }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${COMMIT}&per_page=100" \
            > "${RUNNER_TEMP}/commit-runs.json"
          python3 scripts/release/release_tags.py check-tested \
            --sha "$COMMIT" --runs "${RUNNER_TEMP}/commit-runs.json"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the commit's image exists
        env:
          DOCKERHUB_IMAGE: ${{ steps.tag.outputs.dockerhub }}
          GHCR_IMAGE: ${{ steps.tag.outputs.ghcr }}
          SOURCE: ${{ steps.tag.outputs.source }}
        run: |
          set -euo pipefail
          for repo in "$DOCKERHUB_IMAGE" "$GHCR_IMAGE"; do
            if ! docker buildx imagetools inspect "${repo}:${SOURCE}" > /dev/null; then
              echo "::error::${TAG} points at a commit with no published image (${repo}:${SOURCE}). Tag a commit on main, or a release-X.Y branch, whose Publish images run succeeded."
              exit 1
            fi
          done

      - name: Add the release names
        env:
          DOCKERHUB_IMAGE: ${{ steps.tag.outputs.dockerhub }}
          GHCR_IMAGE: ${{ steps.tag.outputs.ghcr }}
          SOURCE: ${{ steps.tag.outputs.source }}
          NAMES: ${{ steps.tag.outputs.names }}
        run: |
          set -euo pipefail
          read -ra names <<< "$NAMES"
          for repo in "$DOCKERHUB_IMAGE" "$GHCR_IMAGE"; do
            tag_args=()
            for name in "${names[@]}"; do tag_args+=(-t "${repo}:${name}"); done
            docker buildx imagetools create "${tag_args[@]}" "${repo}:${SOURCE}"
            for name in "$SOURCE" "${names[@]}"; do
              echo "${repo}:${name} $(docker buildx imagetools inspect "${repo}:${name}" --format '{{json .Manifest.Digest}}')"
            done
          done

      - name: Publish the GitHub release
        if: steps.tag.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ steps.tag.outputs.title }}
          LATEST: ${{ steps.tag.outputs.latest }}
        # GitHub's "latest release" follows the same rule as the latest image.
        run: |
          gh release create "$TAG" --verify-tag --title "$TITLE" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" --latest="$LATEST"
