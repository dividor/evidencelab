# Build the Evidence Lab Python image (Dockerfile, target runtime: API, MCP
# server and pipeline) for amd64 and arm64 and publish it to Docker Hub and the
# GitHub Container Registry (GHCR).
#
# The web interface is not published. Its build fixes the API key or sign-in
# mode, config.json and branding into the JavaScript bundle, so a shared image
# would either not reach the API or expose a key. docker-compose.hub.yml builds
# it locally instead (about 3 minutes).
#
# When it publishes:
#   tag vX.Y.Z    -> X.Y.Z, X.Y and latest (latest skipped for pre-release tags)
#   push rc/vX.Y.Z -> rc-vX.Y.Z (moves with the release candidate)
#   manual run    -> the branch name
# Pull requests that touch the image inputs build it without pushing,
# so a broken Dockerfile is caught before it reaches an RC branch.
#
# Nothing broken reaches a published tag: the rc/** ruleset refuses a push
# whose required CI checks have not passed, and release tags are cut from main
# after the release PR's CI passes.
#
# Setup (once, by a maintainer):
#   - Repository variable DOCKERHUB_NAMESPACE: the Docker Hub account to push to.
#   - Environment "dockerhub", deployment branches limited to rc/** and tags v*,
#     holding secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub
#     personal access token with Read & Write scope).
#   GHCR uses the workflow's own GITHUB_TOKEN.

name: Publish images

on:
  push:
    branches: [ 'rc/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, 'rc/**' ]
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - ui/backend/requirements.txt
      - .github/workflows/publish-images.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PUBLISH: ${{ github.event_name != 'pull_request' }}
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
  IMAGE: evidencelab

jobs:
  build:
    name: build (${{ matrix.arch.name }})
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 120
    # Publishing runs read the push credentials from the protected environment.
    # Pull request runs only build, so they take no environment.
    environment: ${{ github.event_name != 'pull_request' && 'dockerhub' || '' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - name: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      # The image needs more than the runner's free disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift \
            /usr/local/graalvm /usr/local/share/boost /usr/share/miniconda
          docker system prune -af
          df -h /

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve image names
        id: names
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$PUBLISH" = "true" ] && [ -z "$DOCKERHUB_NAMESPACE" ]; then
            echo "::error::Repository variable DOCKERHUB_NAMESPACE is not set"
            exit 1
          fi
          if [ -n "$DOCKERHUB_NAMESPACE" ]; then
            echo "dockerhub=docker.io/${DOCKERHUB_NAMESPACE}/${IMAGE}" >> "$GITHUB_OUTPUT"
          fi
          echo "ghcr=ghcr.io/${OWNER,,}/${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Image labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ steps.names.outputs.dockerhub }}
            ${{ steps.names.outputs.ghcr }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publishing pushes this platform's image by digest to both registries;
      # the merge job then tags one multi-arch manifest. Pull requests build
      # into the cache only.
      - name: Build options
        id: opts
        env:
          DOCKERHUB_IMAGE: ${{ steps.names.outputs.dockerhub }}
          GHCR_IMAGE: ${{ steps.names.outputs.ghcr }}
          ARCH: ${{ matrix.arch.name }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            echo "outputs=type=image,\"name=${DOCKERHUB_IMAGE},${GHCR_IMAGE}\",push-by-digest=true,name-canonical=true,push=true" >> "$GITHUB_OUTPUT"
            echo "cache-to=type=registry,ref=${DOCKERHUB_IMAGE}:buildcache-${ARCH},mode=max" >> "$GITHUB_OUTPUT"
          else
            echo "outputs=type=cacheonly" >> "$GITHUB_OUTPUT"
            echo "cache-to=" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$DOCKERHUB_IMAGE" ]; then
            echo "cache-from=type=registry,ref=${DOCKERHUB_IMAGE}:buildcache-${ARCH}" >> "$GITHUB_OUTPUT"
          else
            echo "cache-from=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: ${{ matrix.arch.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: ${{ steps.opts.outputs.outputs }}
          cache-from: ${{ steps.opts.outputs.cache-from }}
          cache-to: ${{ steps.opts.outputs.cache-to }}
          provenance: ${{ env.PUBLISH == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ env.PUBLISH == 'true' }}

      - name: Record digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch.name }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: publish
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment: dockerhub
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Resolve image names
        id: names
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "$DOCKERHUB_NAMESPACE" ]; then
            echo "::error::Repository variable DOCKERHUB_NAMESPACE is not set"
            exit 1
          fi
          echo "dockerhub=docker.io/${DOCKERHUB_NAMESPACE}/${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "ghcr=ghcr.io/${OWNER,,}/${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ steps.names.outputs.dockerhub }}
            ${{ steps.names.outputs.ghcr }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        working-directory: ${{ runner.temp }}/digests
        env:
          DOCKERHUB_IMAGE: ${{ steps.names.outputs.dockerhub }}
          GHCR_IMAGE: ${{ steps.names.outputs.ghcr }}
        run: |
          set -euo pipefail
          for repo in "$DOCKERHUB_IMAGE" "$GHCR_IMAGE"; do
            mapfile -t tag_args < <(jq -r --arg repo "$repo" \
              '.tags[] | select(startswith($repo + ":")) | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
            if [ "${#tag_args[@]}" -eq 0 ]; then
              echo "::error::No tags generated for $repo"
              exit 1
            fi
            sources=()
            for digest in *; do sources+=("${repo}@sha256:${digest}"); done
            docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          done

      - name: Inspect
        env:
          DOCKERHUB_IMAGE: ${{ steps.names.outputs.dockerhub }}
          GHCR_IMAGE: ${{ steps.names.outputs.ghcr }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:${VERSION}"
          docker buildx imagetools inspect "${GHCR_IMAGE}:${VERSION}"
