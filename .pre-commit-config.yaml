# Pre-commit hooks for code quality
# See https://pre-commit.com for more information

# Pin Python hooks to 3.11 (the project runtime per CLAUDE.md). Without
# this, pre-commit auto-selects whichever `python3` it finds on PATH first,
# which on macOS dev machines is often the system 3.9 — and several hooks
# (mypy, bandit) plus the codebase itself use PEP 604 union syntax that
# only works on Python 3.10+.
default_language_version:
  python: python3.11

repos:
  # General file formatting
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=2000']
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending

  # Python code formatting with Black
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        language_version: python3.11

  # Import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]

  # Python linting with flake8
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: ['--max-line-length=100', '--extend-ignore=E203,W503']

  # Type checking with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies:
          - types-requests
          - types-beautifulsoup4
          - types-openpyxl
          - sqlalchemy[mypy]
          - google-cloud-discoveryengine
        args: [--ignore-missing-imports]
        exclude: ^(tests/|scripts/|alembic/)

  # Python security scanning with Bandit
  # Fails on MEDIUM and HIGH severity issues (-ll).
  # Fails on MEDIUM and HIGH severity issues (-ll).
  # Skipped checks (confirmed false positives — each is documented here):
  # - B310: urlopen() calls in azure_foundry_reranker.py and search_models.py;
  #         both validate that the URL scheme is http/https before calling urlopen,
  #         but bandit cannot follow that control flow statically.
  # - B608: SQL built with f-strings for table/column names derived from config,
  #         never from user input; all user-supplied values use %s parameterisation.
  # - B104: Binding to 0.0.0.0 is intentional for the MCP/A2A HTTP server.
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ['-r', '-ll', '--skip', 'B310,B608,B104,B615', '--exclude', 'tests,node_modules,.venv']
        exclude: ^(tests/|alembic/|analysis/prototypes/|pipeline/integration/)

  # Dockerfile linting with Hadolint
  # Ignored rules:
  # - DL3007: Using latest for internal base images (evidencelab-ai-base)
  # - DL3008/DL3013: Pin versions in apt/pip (handled by requirements.txt)
  # - DL3015: --no-install-recommends (info level, minor)
  # - DL3018: Pin versions in apk (info level)
  # - DL3042: Avoid cache dir (handled differently)
  # - DL3059: Multiple RUN (info level, build optimization)
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        # The upstream hook entry has no image tag, so it silently floats to
        # ghcr.io latest regardless of rev; pin the image to match rev.
        entry: ghcr.io/hadolint/hadolint:v2.12.0 hadolint
        args: ['--ignore', 'DL3007', '--ignore', 'DL3008', '--ignore', 'DL3013', '--ignore', 'DL3015', '--ignore', 'DL3018', '--ignore', 'DL3042', '--ignore', 'DL3059']

  # Secret scanning with detect-secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package.lock.json

  # Enhanced secret scanning with Gitleaks
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.1
    hooks:
      - id: gitleaks

  # Code complexity metrics (Python + JS/TS)
  - repo: local
    hooks:
      - id: code-metrics
        name: code-metrics
        entry: python scripts/quality/code_metrics.py --fail-on-bad --skip-js-cognitive
        language: python
        pass_filenames: false
        additional_dependencies:
          - lizard
          - radon
          - cognitive-complexity
